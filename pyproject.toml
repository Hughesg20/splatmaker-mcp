[project]
name = "splatmaker-mcp"
version = "0.4.0"
description = "Self-hosted FOSS Gaussian-splat generation MCP — worldlabs-mcp alternative, zero marginal cost, local 4090 inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Floor pinned per fleet doctrine (JUNE_2026_STANDARDS_BAR.md): 3.2.0 is a
    # deliberate low floor for compat, NOT the target version. uv resolves to
    # whatever is latest <4.0 at sync time - verified 2026-07-13 this correctly
    # resolves to 3.4.4 (current PyPI SOTA), not 3.2.0. Do not "fix" this by
    # bumping the floor number; check PyPI if you want to know the real current
    # version, don't trust this string as a version report.
    "fastmcp>=3.4.4,<4",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pyright>=1.1",
    "prefab-ui>=0.21",
    "pyinstaller>=6.0",
    "ruff>=0.16.0,<0.17",
]
engine = [
    # Nerfstudio pulls gsplat as its rasterization backend automatically -
    # DECIDED 2026-07-13 (see README.md "Engine status"): Nerfstudio over
    # bare gsplat (too much DIY glue) and Postshot (scratched - paid CLI
    # behind a free download, bait-and-switch shaped).
    # CUDA-only stack: no macOS wheels exist, so gate to Linux/Windows.
    "torch>=2.4; sys_platform != 'darwin'",
    "torchvision; sys_platform != 'darwin'",
    "nerfstudio>=1.1; sys_platform != 'darwin'",
]
mps = [
    # macOS Apple Silicon engine (SPLATMAKER_ENGINE=mps): metalsplat is a
    # gsplat-equivalent rasterizer with hand-written Metal kernels, trains on
    # the torch `mps` backend. Apple Silicon only (MPS), so the dependency
    # itself is darwin-gated. Path source set in tool.uv.sources below; swap
    # for a published sdist/wheel when metalsplat ships one.
    "metalsplat; sys_platform == 'darwin'",
]

[tool.uv.sources]
# cu124 index only publishes Linux/Windows wheels; on macOS resolve torch
# (with MPS) from PyPI instead.
torch = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }
# metalsplat is only resolvable on macOS (MPS backend); local path clone.
metalsplat = { path = "/Users/griffyj/Desktop/Mcp/metalsplat-main", marker = "sys_platform == 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
splatmaker-mcp = "splatmaker_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "pywinauto>=0.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/splatmaker_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

# CUA operator scripts use print() as their interface (fleet template
# cua-smoke.py v15) — same exemption as aiwatcher-mcp's scripts/**.
[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
[tool.uv]
# nerfstudio's dependency tree pulls in newrawpy, which only has pre-release
# versions satisfying nerfstudio's constraint as of 2026-07-13 - found this
# via a real failed `uv sync`, not guessed.
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=splatmaker_mcp --cov-report=term-missing --cov-fail-under=40"
